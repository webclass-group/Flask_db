<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ورود کاربر | سامانه Flask</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f5132, #198754);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Background shapes */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            z-index: 1;
        }

        .shape-1 {
            width: 320px;
            height: 320px;
            background: #20c997;
            top: -80px;
            right: -80px;
        }

        .shape-2 {
            width: 260px;
            height: 260px;
            background: #6f42c1;
            bottom: -60px;
            left: -60px;
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            background: #0dcaf0;
            top: 40%;
            left: 60%;
        }

        /* Login Card */
        .login-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 18px;
            padding: 35px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-title {
            font-weight: 800;
            color: #0f5132;
        }

        .form-control {
            border-radius: 12px;
            padding: 10px 14px;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.25);
            border-color: #198754;
        }

        .btn-login {
            border-radius: 12px;
            padding: 10px;
            font-weight: 600;
            background: linear-gradient(135deg, #198754, #20c997);
            border: none;
        }

        .btn-login:hover {
            opacity: 0.9;
        }

        .register-link a {
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <!-- Background shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <div class="login-card">

        <h2 class="text-center mb-4 login-title">🔐 ورود به حساب کاربری</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'info' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <div class="mb-3">
                <label for="email" class="form-label">📧 ایمیل</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">🔑 رمز عبور</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-success w-100 btn-login">
                ورود به سامانه
            </button>

        </form>

        <hr class="my-4">

        <div class="text-center register-link">
            <span class="text-muted">حساب کاربری ندارید؟</span><br>
            <a href="{{ url_for('register') }}" class="text-primary">
                ثبت‌نام کاربر جدید
            </a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
