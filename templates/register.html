<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ثبت نام کاربر | سامانه Flask</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    
    <style>
        body {
            direction: rtl;
            text-align: right;
            background-color: #f8f9fa; /* رنگ پس زمینه روشن */
        }
        .container {
            max-width: 500px; /* حداکثر عرض فرم برای زیبایی */
            margin-top: 50px;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4 text-primary">👤 ثبت نام کاربر جدید</h1>
        <p class="text-center text-muted">این فرم، پسورد را به صورت **هش شده** ذخیره می‌کند.</p>
        
        <form method="POST" action="{{ url_for('register') }}">
            
            <div class="mb-3">
                <label for="username" class="form-label">نام کاربری:</label>
                <input type="text" class="form-control" id="username" name="username" required aria-describedby="usernameHelp">
                <div id="usernameHelp" class="form-text">نام کاربری باید یکتا باشد.</div>
            </div>
            
            <div class="mb-3">
                <label for="email" class="form-label">ایمیل:</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label">رمز عبور:</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-success w-100">✅ ثبت نام</button>
            
        </form>
        
        <hr class="my-4">
        
        <div class="text-center">
             <a href="{{ url_for('users_list') }}" class="btn btn-outline-secondary btn-sm">مشاهده لیست کاربران ثبت نام شده</a>
        </div>
        
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
